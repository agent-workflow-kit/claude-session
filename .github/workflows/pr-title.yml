name: pr-title

# Thin caller for agent-workflow-kit/awkit-ci. Required status check: `pr-title / pr-title`.
# Source: https://github.com/agent-workflow-kit/awkit-ci/tree/main/templates

on:
  # `pull_request`, not `pull_request_target`: GitHub blocks the latter by default (policy
  # enforced 2026-12-02). Fork PRs get a read-only token, which is enough: the called
  # workflow only reads the PR title through the API and never checks out PR code. The
  # check for a fork PR starts after the usual first-time-contributor approval.
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read # read the PR title

jobs:
  pr-title:
    uses: agent-workflow-kit/awkit-ci/.github/workflows/pr-title.yml@v0.1.0
