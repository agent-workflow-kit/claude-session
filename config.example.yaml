#      respond:
#        read_dirs: ["~/.nvm/versions/node"]
#        write_dirs: ["${CSESSION_DIR}/work/.npm-cache"]   # created before launch
#        env:
#          set:
#            npm_config_cache: "${CSESSION_DIR}/work/.npm-cache"   # per-session, not shared ~/.npm
